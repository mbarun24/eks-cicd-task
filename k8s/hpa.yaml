
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: product-catalog-hpa
  namespace: product-catalog

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-catalog

  minReplicas: 3
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
